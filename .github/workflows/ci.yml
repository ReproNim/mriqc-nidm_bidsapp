name: MRIQC-NIDM BIDS App CI

on:
  push:
    branches: [ main ]
  # No base-branch filter: a `branches: [main]` filter here matches the PR's
  # BASE ref, so a PR stacked on another PR's branch runs no CI at all. That is
  # the wrong default for a repo whose PRs are routinely stacked -- the change
  # least likely to have been validated is the one that gets skipped.
  pull_request:

jobs:
  test:
    # Skip the workflow if the commit message contains [skip CI]
    if: "!contains(github.event.head_commit.message, '[skip CI]')"
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      # The same pins as the Dockerfile's install: requirements.txt (pynidm
      # 5.0.0 with rdflib 7), then the app itself with --no-deps. Not the same
      # resolved set: the image installs into MRIQC 25's conda env (Python
      # 3.11, conda pandas 2.2, numpy 1.26), while this runner gets Python 3.10
      # and the newest PyPI releases (pandas 3.x). csv2nidm reads the IQM CSV
      # with pandas, and pandas 2.2's default float parser is not round-trip
      # exact, so IQM literals in the image's nidm.ttl can differ from the IQM
      # JSON in the last digits; CI does not see that.
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov flake8 pyyaml
        pip install --no-deps -e .

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with pytest
      run: |
        pytest --cov=src tests/

  docker:
    runs-on: ubuntu-latest
    needs: test
    # Runs on PRs too, not just push-to-main. Gating image builds on push-only is
    # how the sibling freesurfer app let a broken build sit undetected for months;
    # the PR is where a broken Dockerfile has to be caught. head_commit only
    # exists on push events, so the skip-CI check is scoped to push and this job
    # always runs on pull_request.
    if: "github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip CI]')"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: false
        load: true
        tags: mriqc-nidm:test
        build-args: GIT_COMMIT=${{ github.event.pull_request.head.sha || github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Check the image records its commit
      run: |
        rev=$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' mriqc-nidm:test)
        echo "org.opencontainers.image.revision=$rev"
        test "$rev" = "${{ github.event.pull_request.head.sha || github.sha }}"
        ver=$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.version" }}' mriqc-nidm:test)
        echo "org.opencontainers.image.version=$ver"
        test "$ver" = "$(python3 -c 'import json; print(json.load(open("VERSION"))["mriqc-nidm"]["version"])')"

    - name: Smoke-test the entrypoint
      # Proves the image's ENTRYPOINT actually resolves and runs. Building alone
      # does not: the previous ENTRYPOINT pointed at /opt/src/mriqc_nidm/run.py,
      # a path that has never existed in this repo, and the build was still green.
      run: |
        docker run --rm mriqc-nidm:test --version
        docker run --rm mriqc-nidm:test --help

  # NOTE: no singularity job on purpose. `singularity build` from a definition
  # file hangs for hours on GitHub-hosted runners (unprivileged user-namespace
  # restriction) rather than failing -- see ReproNim/freesurfer-nidm_bidsapp#12.
  # The .sif is built and validated on the HPC cluster instead.
